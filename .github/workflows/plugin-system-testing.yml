name: Plugin System Tests

on:
  push:
    branches: [main, develop]
    paths:
      - 'src/components/plugins/**'
      - 'src/services/**'
      - 'tests/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/components/plugins/**'
      - 'src/services/**'
      - 'tests/**'
  workflow_dispatch:

env:
  NODE_VERSION: '20'
  NODE_OPTIONS: '--max_old_space_size=4096'

jobs:
  plugin-tests:
    name: Plugin Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: plugin_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Push database schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/plugin_test
        run: npx prisma db push --force-reset

      - name: Run plugin tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/plugin_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          NEXTAUTH_SECRET: test-secret-min-32-chars-long-here
          JWT_SECRET: test-jwt-secret-min-32-chars-long-here
          ENCRYPTION_KEY: test-enc-key-32-chars-minimum!!
        run: |
          npm test -- --ci --passWithNoTests --forceExit \
            --testPathPattern="plugins|plugin" || true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-test-results
          path: coverage/
          retention-days: 14
